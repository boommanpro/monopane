name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要写 Pages、并用 OIDC 令牌完成部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署；不打断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # GitHub Pages 项目站点挂在 /<repo>/ 下。
  # 这里从仓库名推导（本仓库为 /monopane/），fork 后无需改配置。
  ASSET_PREFIX: /${{ github.event.repository.name }}/

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 尝试自动开启 Pages 站点（GITHUB_TOKEN 通常没有创建站点的权限，因此
      # 不阻塞构建）。仓库首次启用 Pages 需要手动在 Settings → Pages 里把
      # Source 选为「GitHub Actions」，之后本 workflow 即可全自动部署。
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 用根脚本从 workspace 顶层构建：pnpm 会按依赖顺序先构建 @monopane/canvas，
      # 再构建 @monopane/app（后者的类型与运行时都从 canvas 的 dist 解析，
      # 单独 --filter 构建 app 会因缺少 dist 报 "Can't resolve '@monopane/canvas'"）。
      # ASSET_PREFIX 会同时作用于两个入口：
      #   编辑器 -> /monopane/           只读预览 -> /monopane/viewer/
      - name: Build editor and viewer
        run: pnpm build

      # 组装站点目录：
      #   /            <- packages/app/dist        （编辑器）
      #   /viewer/     <- packages/app/dist-viewer （只读预览）
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/viewer
          cp -R packages/app/dist/. _site/
          cp -R packages/app/dist-viewer/. _site/viewer/
          # 关闭 Jekyll 处理，避免构建产物被改写
          touch _site/.nojekyll
          echo "--- 站点结构（前两层）---"
          find _site -maxdepth 2 -mindepth 1 | sort | head -40

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
